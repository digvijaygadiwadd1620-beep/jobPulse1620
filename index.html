    <meta charset="UTF-8" />

    <title>JobPulse - 24/7 AI Job Search & Matching Assistant</title>
    <meta name="description" content="24/7 personal job search assistant that parses your resume, scores live global jobs with TF-IDF, tracks applications, and alerts you instantly." />
    <meta property="og:title" content="JobPulse - 24/7 AI Job Search & Matching Assistant" />
    <meta property="og:description" content="24/7 personal job search assistant that parses your resume, scores live global jobs with TF-IDF, tracks applications, and alerts you instantly." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Permanently neutralize browser WebSocket and replace with zero-error safe interface
      (function () {
        class CleanNoopSocket extends EventTarget {
          static CONNECTING = 0;
          static OPEN = 1;
          static CLOSING = 2;
          static CLOSED = 3;

          constructor(url, protocols) {
            super();
            this.url = String(url || '');
            this.protocols = protocols || '';
            this.readyState = CleanNoopSocket.OPEN;
            this.binaryType = 'blob';
            this.bufferedAmount = 0;
            this.extensions = '';
            this.protocol = '';
            this.onopen = null;
            this.onclose = null;
            this.onerror = null;
            this.onmessage = null;

            // Instantly transition to open state so callers never retry or log errors
            setTimeout(() => {
              if (this.readyState === CleanNoopSocket.OPEN) {
                var evt = new Event('open');
                if (typeof this.onopen === 'function') {
                  try { this.onopen.call(this, evt); } catch (_) {}
                }
                this.dispatchEvent(evt);
              }
            }, 10);
          }

          send(_) {
            // No-op: all operations seamlessly use reliable HTTP REST APIs
          }

          close(code, reason) {
            this.readyState = CleanNoopSocket.CLOSED;
            var evt = new Event('close');
            evt.code = code || 1000;
            evt.reason = reason || 'Normal Closure';
            evt.wasClean = true;
            if (typeof this.onclose === 'function') {
              try { this.onclose.call(this, evt); } catch (_) {}
            }
            this.dispatchEvent(evt);
          }
        }

        CleanNoopSocket.prototype.CONNECTING = 0;
        CleanNoopSocket.prototype.OPEN = 1;
        CleanNoopSocket.prototype.CLOSING = 2;
        CleanNoopSocket.prototype.CLOSED = 3;

        window.WebSocket = CleanNoopSocket;

        // Clean console logging so no rogue websocket disconnection warnings clutter dev tools
        var origWarn = console.warn;
        var origError = console.error;
        console.warn = function () {
          var args = Array.prototype.slice.call(arguments);
          var text = args.map(function (a) { return typeof a === 'string' ? a : (a && a.message) || ''; }).join(' ');
          if (/websocket|vite.*failed to connect/i.test(text)) return;
          return origWarn.apply(console, args);
        };
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var text = args.map(function (a) { return typeof a === 'string' ? a : (a && a.message) || ''; }).join(' ');
          if (/websocket|vite.*failed to connect/i.test(text)) return;
          return origError.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || (typeof reason === 'string' ? reason : ''))) || '';
          if (typeof msg === 'string' && /websocket/i.test(msg)) {
            event.preventDefault();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
